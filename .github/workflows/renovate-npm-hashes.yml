name: Renovate npm hashes

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Same-repository human PRs need the same required status as Renovate PRs.
    # Fork PRs cannot publish it with their read-only token and remain blocked.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Test dependency maintenance scripts
        run: |
          python3 tests/test-update-npm-deps-hashes.py
          python3 tests/test-repair-npm-integrities.py
      - name: Repair missing npm integrity metadata
        if: github.event.pull_request.user.login == 'renovate[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/repair-npm-integrities.py --base "$BASE_SHA"
      - name: Refresh changed dependency caches
        if: github.event.pull_request.user.login == 'renovate[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/update-npm-deps-hashes.py --base "$BASE_SHA"
      - name: Validate the updated tree
        run: |
          nix fmt
          nix build .#pi-ext --no-link --keep-going
          nix flake check --no-build
          nix shell --inputs-from . nixpkgs#nodejs --command bash tests/pi-ext-builtins.sh
          nix shell --inputs-from . nixpkgs#nodejs --command bash tests/pi-ext-themes.sh
          nix shell --inputs-from . nixpkgs#python3 --command bash tests/pi-ext-skills.sh
          git diff --check
      - name: Require human PR trees to remain unchanged
        if: github.event.pull_request.user.login != 'renovate[bot]'
        run: git diff --exit-code HEAD
      - name: Prepare dependency repair patch
        if: github.event.pull_request.user.login == 'renovate[bot]'
        id: patch
        shell: bash
        run: |
          # Refuse unrelated changes, existing integrity edits, or dependency updates.
          python3 scripts/validate-npm-dependency-patch.py
          mkdir -p "$RUNNER_TEMP/npm-hashes"
          git diff --no-ext-diff HEAD > "$RUNNER_TEMP/npm-hashes/hashes.patch"
          if test -s "$RUNNER_TEMP/npm-hashes/hashes.patch"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.patch.outputs.changed == 'true'
        with:
          name: npm-hashes
          path: ${{ runner.temp }}/npm-hashes/hashes.patch
          retention-days: 1

  # Dependency fetching/builds run above with a read-only token. This fresh
  # runner gets write access but never runs scripts from the PR or its packages.
  push:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.changed == 'true'
        with:
          name: npm-hashes
          path: ${{ runner.temp }}/npm-hashes
      - name: Commit and push validated dependency repairs
        if: >-
          github.event.pull_request.user.login == 'renovate[bot]' &&
          needs.validate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Execute the guard from the trusted base, never the PR/artifact version.
          git show "$BASE_SHA:scripts/validate-npm-dependency-patch.py" > "$RUNNER_TEMP/validate-dependency-patch.py"
          git apply --index "$RUNNER_TEMP/npm-hashes/hashes.patch"
          git diff --cached --check
          python3 -I "$RUNNER_TEMP/validate-dependency-patch.py" --root "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix: repair npm integrity metadata and Nix dependency hashes'
          gh auth setup-git
          # A normal push rejects concurrent updates; never force-push over Renovate.
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$HEAD_REF"
      # Publish on the exact validated SHA, including when follow-up workflow
      # runs are suppressed or require approval and when no repairs were needed.
      - name: Record validation status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context='pi-ext-build' \
            -f description='Real pi-ext build and regression tests passed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

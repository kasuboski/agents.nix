name: Renovate npm hashes

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Test the hash updater
        run: python3 tests/test-update-npm-deps-hashes.py
      - name: Refresh changed dependency caches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/update-npm-deps-hashes.py --base "$BASE_SHA"
      - name: Validate the updated tree
        run: |
          nix fmt
          nix build .#pi-ext --no-link --keep-going
          nix flake check --no-build
          nix shell --inputs-from . nixpkgs#nodejs --command bash tests/pi-ext-builtins.sh
          nix shell --inputs-from . nixpkgs#nodejs --command bash tests/pi-ext-themes.sh
          nix shell --inputs-from . nixpkgs#python3 --command bash tests/pi-ext-skills.sh
          git diff --check
      - name: Prepare hash-only patch
        id: patch
        shell: bash
        run: |
          # Refuse to silently omit unrelated changes made by formatting or validation.
          test -z "$(git diff --name-only -- . ':!packages/build-pi-extensions.nix')"
          mkdir -p "$RUNNER_TEMP/npm-hashes"
          git diff -- packages/build-pi-extensions.nix > "$RUNNER_TEMP/npm-hashes/hashes.patch"
          if test -s "$RUNNER_TEMP/npm-hashes/hashes.patch"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.patch.outputs.changed == 'true'
        with:
          name: npm-hashes
          path: ${{ runner.temp }}/npm-hashes/hashes.patch
          retention-days: 1

  # Dependency fetching/builds run above with a read-only token. This fresh
  # runner gets write access but never runs scripts from the PR or its packages.
  push:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.changed == 'true'
        with:
          name: npm-hashes
          path: ${{ runner.temp }}/npm-hashes
      - name: Commit and push validated hashes
        if: needs.validate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git apply --include=packages/build-pi-extensions.nix "$RUNNER_TEMP/npm-hashes/hashes.patch"
          git diff --check
          python3 -I - <<'PY'
          import pathlib, re, subprocess
          name = 'packages/build-pi-extensions.nix'
          before = subprocess.check_output(['git', 'show', f'HEAD:{name}'], text=True)
          after = pathlib.Path(name).read_text()
          def scrub(text):
              return re.sub(r'sha256-[A-Za-z0-9+/]{43}=', '<hash>', text)
          if scrub(before) != scrub(after):
              raise SystemExit('Refusing patch that changes anything other than SHA-256 hashes')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/build-pi-extensions.nix
          git -c core.hooksPath=/dev/null commit -m 'fix: refresh Nix npm dependency hashes'
          gh auth setup-git
          # A normal push rejects concurrent updates; never force-push over Renovate.
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$HEAD_REF"
      # GITHUB_TOKEN pushes do not trigger new workflows. Publish the validation
      # on the new commit (or the original head if hashes were already correct).
      - name: Record validation status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context='pi-ext-build' \
            -f description='Hash refresh, real pi-ext build, and regression tests passed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
